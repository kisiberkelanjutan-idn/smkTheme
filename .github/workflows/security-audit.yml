name: Security & Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: PHP Lint, Malware Scan & SHA256SUMS Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify no secret or environment files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|id_rsa|\.pem$|\.key$'; then
            echo "::error::Secret or environment file is tracked in Git!"
            exit 1
          fi

      - name: Verify pure LF line endings and zero UTF-8 BOM on deployment configs
        run: |
          for f in .cpanel.yml SHA256SUMS .htaccess; do
            if grep -Pq '\r' "$f"; then
              echo "::error::CRLF detected in $f"
              exit 1
            fi
            if head -c 3 "$f" | grep -Pq '^\xEF\xBB\xBF'; then
              echo "::error::UTF-8 BOM detected in $f"
              exit 1
            fi
          done

      - name: Validate PHP syntax across all PHP files
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Scan for dangerous PHP/Smarty/JS injection primitives
        run: |
          if grep -RInP --include='*.php' --include='*.tpl' \
            '\b(eval|base64_decode|gzinflate|gzuncompress|str_rot13|shell_exec|passthru|proc_open|popen|system|(?<!curl_)exec|assert|create_function|move_uploaded_file)\s*\(' \
            templates index.php SmkThemePlugin.php; then
            echo "::error::Suspicious code execution primitive detected!"
            exit 1
          fi

      - name: Verify SHA256SUMS cryptographic manifest & complete file coverage
        run: |
          sha256sum -c SHA256SUMS
          expected=$(awk '{print $2}' SHA256SUMS | sort)
          actual=$(find assets js locale styles templates .htaccess index.php README.md SmkThemePlugin.php version.xml -type f | sed 's|^\./||' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Mismatch between deployable files and SHA256SUMS manifest!"
            diff -u <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
