---
deployment:
  tasks:
    # Menggunakan $HOME & /bin/cp agar kompatibel dengan CloudLinux/CageFS tanpa ssh/rsync
    - export DEPLOYPATH=$HOME/public_html/plugins/themes/smkTheme/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/assets $DEPLOYPATH/js $DEPLOYPATH/locale $DEPLOYPATH/styles $DEPLOYPATH/templates
    - /bin/cp -f index.php SmkThemePlugin.php version.xml $DEPLOYPATH
    - /bin/cp -R assets js locale styles templates $DEPLOYPATH
