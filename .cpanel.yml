---
deployment:
  tasks:
    - /bin/sh ./scripts/verify-deploy.sh
    - export DEPLOYPATH="$HOME/public_html/plugins/themes/smkTheme"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH"/* "$DEPLOYPATH"/.[!.]* "$DEPLOYPATH"/..?*
    - /bin/cp -f .htaccess index.php README.md SmkThemePlugin.php version.xml "$DEPLOYPATH"/
    - /bin/cp -R assets js locale styles templates "$DEPLOYPATH"/
    - find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} \;
    - find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} \;
    - /bin/sh ./scripts/verify-deploy.sh --verify-target "$DEPLOYPATH"
